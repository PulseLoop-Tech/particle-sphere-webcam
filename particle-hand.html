<!DOCTYPE html>
<html>
<head>
  <title>Two Hand Particle Sphere</title>
  <style>
    body {
    margin: 0;
    overflow: hidden;
    background: black;
}

video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    z-index: 0;

    filter: blur(1.5px) brightness(0.75);
}

canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1;
}
  </style>
</head>
<body>

<video id="video" autoplay playsinline></video>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
let scene, camera, renderer, particles, positions, originalPositions, velocities;
let handPoint = null;
let twoHandCenter = null;
let twoHandDistance = null;
let pinch = false;
let wasPinching = false;
let explosionPower = 0;
const count = 3000;

init();
animate();

function init() {
  scene = new THREE.Scene();
  scene.background = null;

  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 4;

  renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true
});
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const geometry = new THREE.BufferGeometry();
  positions = new Float32Array(count * 3);
  originalPositions = new Float32Array(count * 3);
  velocities = new Float32Array(count * 3);

  for (let i = 0; i < count; i++) {
    const phi = Math.acos(2 * Math.random() - 1);
    const theta = Math.random() * Math.PI * 2;
    const r = 1.3;

    const x = r * Math.sin(phi) * Math.cos(theta);
    const y = r * Math.sin(phi) * Math.sin(theta);
    const z = r * Math.cos(phi);

    positions[i * 3] = originalPositions[i * 3] = x;
    positions[i * 3 + 1] = originalPositions[i * 3 + 1] = y;
    positions[i * 3 + 2] = originalPositions[i * 3 + 2] = z;
  }

  geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));


  const material = new THREE.PointsMaterial({
    color: 0xfff0c2,
    size: 0.065,
    transparent: true,
    opacity: 0.85,
    blending: THREE.NormalBlending,
    depthWrite: false
});

  particles = new THREE.Points(geometry, material);
  scene.add(particles);

  setupHands();

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

function setupHands() {
  const video = document.getElementById("video");

  const hands = new Hands({
    locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });

  hands.setOptions({
    maxNumHands: 2,
    modelComplexity: 1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.7
  });

  hands.onResults(results => {
    const handsList = results.multiHandLandmarks || [];

    if (handsList.length === 2) {
      const h1 = handsList[0][9];
      const h2 = handsList[1][9];

      const x1 = (h1.x - 0.5) * 5;
      const y1 = -(h1.y - 0.5) * 5;

      const x2 = (h2.x - 0.5) * 5;
      const y2 = -(h2.y - 0.5) * 5;

      twoHandCenter = {
    x: -((x1 + x2) / 2),
    y: (y1 + y2) / 2,
    z: 0
    };

      twoHandDistance = Math.hypot(x1 - x2, y1 - y2);

      handPoint = null;
      pinch = false;
      wasPinching = false;

    } else if (handsList.length === 1) {
      const lm = handsList[0];

      const index = lm[8];
      const thumb = lm[4];

      handPoint = {
        x: (index.x - 0.5) * 5,
        y: -(index.y - 0.5) * 5,
        z: 0
      };

      const pinchDistance = Math.hypot(index.x - thumb.x, index.y - thumb.y);
      pinch = pinchDistance < 0.055;

      if (wasPinching && !pinch) {
        explosionPower = 1.0;
      }

      wasPinching = pinch;

      twoHandCenter = null;
      twoHandDistance = null;

    } else {
      handPoint = null;
      twoHandCenter = null;
      twoHandDistance = null;
      pinch = false;
      wasPinching = false;
    }
  });

  const cam = new Camera(video, {
    onFrame: async () => {
      await hands.send({ image: video });
    },
    width: 640,
    height: 480
  });

  cam.start();
}

function animate() {
  requestAnimationFrame(animate);

  particles.rotation.y += 0.001;
  particles.rotation.x += 0.0005;
  particles.position.y = Math.sin(Date.now() * 0.001) * 0.08;

  if (twoHandCenter) {
    particles.position.x += (twoHandCenter.x - particles.position.x) * 0.12;
    particles.position.y += (twoHandCenter.y - particles.position.y) * 0.12;

    const scale = THREE.MathUtils.clamp(twoHandDistance / 2.2, 0.6, 1.7);
    particles.scale.x += (scale - particles.scale.x) * 0.1;
    particles.scale.y += (scale - particles.scale.y) * 0.1;
    particles.scale.z += (scale - particles.scale.z) * 0.1;
  } else {
    particles.position.x += (0 - particles.position.x) * 0.04;
    particles.position.y += (0 - particles.position.y) * 0.04;

    particles.scale.x += (1 - particles.scale.x) * 0.04;
    particles.scale.y += (1 - particles.scale.y) * 0.04;
    particles.scale.z += (1 - particles.scale.z) * 0.04;
  }

  for (let i = 0; i < count; i++) {
    const ix = i * 3;

    let x = positions[ix];
    let y = positions[ix + 1];
    let z = positions[ix + 2];

    const ox = originalPositions[ix];
    const oy = originalPositions[ix + 1];
    const oz = originalPositions[ix + 2];

    let vx = velocities[ix];
    let vy = velocities[ix + 1];
    let vz = velocities[ix + 2];

    if (pinch) {
      x += (ox * 0.45 - x) * 0.08;
      y += (oy * 0.45 - y) * 0.08;
      z += (oz * 0.45 - z) * 0.08;
    }

    if (explosionPower > 0) {
      const len = Math.sqrt(ox * ox + oy * oy + oz * oz) || 1;
      vx += (ox / len) * explosionPower * 0.04;
      vy += (oy / len) * explosionPower * 0.04;
      vz += (oz / len) * explosionPower * 0.04;
    }

    if (handPoint && !pinch && explosionPower < 0.1) {
      const dx = x - handPoint.x;
      const dy = y - handPoint.y;
      const dz = z - handPoint.z;
      const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

      if (dist < 0.9) {
        const force = 0.025;
        vx += dx * force;
        vy += dy * force;
        vz += dz * force;
      }
    }

    x += vx;
    y += vy;
    z += vz;

    vx *= 0.88;
    vy *= 0.88;
    vz *= 0.88;

    x += (ox - x) * 0.03;
    y += (oy - y) * 0.03;
    z += (oz - z) * 0.03;

    positions[ix] = x;
    positions[ix + 1] = y;
    positions[ix + 2] = z;

    velocities[ix] = vx;
    velocities[ix + 1] = vy;
    velocities[ix + 2] = vz;
  }

  explosionPower *= 0.94;

  particles.geometry.attributes.position.needsUpdate = true;

renderer.render(scene, camera);
}
</script>

</body>
</html>
